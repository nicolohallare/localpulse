name: iOS status

# Asks App Store Connect what happened to the uploaded builds (processing, ready, or rejected) and shows it as notes on the run.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Ask App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > s.mjs <<'JS'
          import crypto from 'node:crypto';
          const b64 = (o) => Buffer.from(typeof o === 'string' ? o : JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'ES256', kid: process.env.KEY_ID, typ: 'JWT' });
          const body = b64({ iss: process.env.ISSUER, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' });
          const sig = crypto.sign('sha256', Buffer.from(`${head}.${body}`), { key: process.env.P8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${head}.${body}.${sig}`;
          const get = async (p) => { const r = await fetch(`https://api.appstoreconnect.apple.com/v1/${p}`, { headers: { Authorization: `Bearer ${token}` } }); const j = await r.json(); if (!r.ok) throw new Error(`${r.status} ${JSON.stringify(j.errors || j).slice(0, 300)}`); return j; };
          const note = (m) => console.log(`::notice::${m}`);
          try {
            const apps = await get('apps?limit=20');
            if (!apps.data.length) note('No apps found in App Store Connect for this key.');
            for (const a of apps.data) {
              note(`App: ${a.attributes.name} · ${a.attributes.bundleId} · id ${a.id}`);
              const builds = await get(`builds?filter[app]=${a.id}&sort=-uploadedDate&limit=5`);
              if (!builds.data.length) note(`  No builds yet for ${a.attributes.bundleId}`);
              for (const b of builds.data) note(`  Build ${b.attributes.version}: ${b.attributes.processingState} · uploaded ${b.attributes.uploadedDate} · expired ${b.attributes.expired} · encryption ${b.attributes.usesNonExemptEncryption}`);
            }
          } catch (e) { console.log(`::error::${e.message}`); process.exit(1); }
          JS
          node s.mjs

name: iOS app

# Builds the Ube Banana iPhone app on a cloud Mac and uploads it to TestFlight / App Store Connect.
# Needs these GitHub secrets (from App Store Connect → Users and Access → Integrations → App Store Connect API):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 file text)
on:
  push:
    branches: [main]
    paths: ['ios/**', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        id: gate
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "ready=no" >> "$GITHUB_OUTPUT"; echo "::notice::Apple secrets not added yet — skipping iOS build."; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode on the runner
        if: steps.gate.outputs.ready == 'yes'
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version

      - name: Install and sync
        if: steps.gate.outputs.ready == 'yes'
        run: |
          npm ci
          CI=false npm run build
          npx cap sync ios

      - name: App Store Connect key
        if: steps.gate.outputs.ready == 'yes'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        if: steps.gate.outputs.ready == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.0 \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE" || true
          test -d $RUNNER_TEMP/App.xcarchive || { grep -m5 "error:" archive.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Export and upload to App Store Connect
        if: steps.gate.outputs.ready == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee export.log | tail -5 || \
            { grep -m5 -E "error|Error" export.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in App Store Connect → TestFlight after Apple processes it (about 10–30 min)."

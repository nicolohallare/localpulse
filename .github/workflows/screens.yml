name: App screenshots

# Takes phone-size screenshots of the live app (for pitch decks and store listings) and saves them to the "screens" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          mkdir shots && cd shots
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Take screenshots
        working-directory: shots
        run: |
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const SITE = 'https://ubebanana.app';
          const M = [14.5636, 121.0324];
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true,
            geolocation: { latitude: M[0], longitude: M[1] }, permissions: ['geolocation'], colorScheme: 'light', locale: 'en-PH' });
          const pg = await ctx.newPage();
          const shot = async (n) => { await pg.screenshot({ path: `${n}.png` }); console.log('shot', n); };
          // Texas Roadhouse Estancia, viewed from Makati (about 4 km away)
          await pg.goto(SITE + '/#/place/ChIJe-scLi3JlzMRLFY4NKbBRz8', { waitUntil: 'networkidle' }).catch(() => {});
          await pg.waitForTimeout(5000);
          await pg.getByRole('button', { name: /Save to Want to try/ }).click();
          await pg.waitForTimeout(2500);
          await shot('s1-saved');
          await pg.waitForTimeout(4000);
          await pg.getByRole('button', { name: /Check in here/ }).click();
          await pg.waitForTimeout(6000);
          await shot('s2-too-far');
          await pg.goto(SITE + '/', { waitUntil: 'networkidle' }).catch(() => {});
          await pg.reload({ waitUntil: 'networkidle' }).catch(() => {});
          await pg.waitForTimeout(8000);
          const h = pg.getByRole('heading', { name: 'You wanted to try' });
          console.log('rail count', await h.count());
          if (await h.count()) await h.scrollIntoViewIfNeeded();
          await pg.waitForTimeout(1500);
          await shot('s3-rail');
          // tidy up: remove the test save
          await pg.goto(SITE + '/#/place/ChIJe-scLi3JlzMRLFY4NKbBRz8', { waitUntil: 'networkidle' }).catch(() => {});
          await pg.waitForTimeout(5000);
          const on = pg.getByRole('button', { name: /Saved to Want to try/ });
          console.log('saved state kept', await on.count());
          if (await on.count()) { await on.click(); await pg.waitForTimeout(2500); }
          await shot('s4-removed');
          await ctx.close();
          await b.close();
          JS
          node s.mjs
      - name: Save to the screens branch
        working-directory: shots
        run: |
          mkdir out && mv *.png out/ && cd out
          git init -q && git checkout -q -b screens
          git config user.name "screens-bot" && git config user.email "screens-bot@users.noreply.github.com"
          git add . && git commit -qm "App screenshots $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

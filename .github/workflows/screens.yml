name: App screenshots

# Takes phone-size screenshots of the live app (for pitch decks and store listings) and saves them to the "screens" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          mkdir shots && cd shots
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Take screenshots
        working-directory: shots
        run: |
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const SITE = 'https://ubebanana.app';
          const shots = [
            ['01-east-guide', '/#/mall/sm-east-ortigas?demo=1', 0, [14.5878, 121.1052]],
            ['02-east-list', '/#/mall/sm-east-ortigas?demo=1', 900, [14.5878, 121.1052]],
            ['03-east-place', '/#/place/ChIJ41DKNADHlzMRZZD0e96Kvis', 0, [14.5878, 121.1052]],
            ['04-east-place-more', '/#/place/ChIJ41DKNADHlzMRZZD0e96Kvis', 760, [14.5878, 121.1052]],
            ['05-taytay-guide', '/#/mall/sm-taytay?demo=1', 0, [14.5717, 121.1336]],
            ['06-angono-guide', '/#/mall/sm-angono?demo=1', 0, [14.5307, 121.1536]],
          ];
          const b = await chromium.launch();
          for (const [name, path, y, [lat, lng]] of shots) {
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3, isMobile: true, hasTouch: true,
              geolocation: { latitude: lat, longitude: lng }, permissions: ['geolocation'], colorScheme: 'light', locale: 'en-PH' });
            const pg = await ctx.newPage();
            await pg.goto(SITE + path, { waitUntil: 'networkidle' }).catch(() => {});
            await pg.waitForTimeout(6000);
            if (y) { await pg.evaluate((yy) => window.scrollTo(0, yy), y); await pg.waitForTimeout(2500); }
            await pg.screenshot({ path: `${name}.png` });
            console.log('shot', name);
            await ctx.close();
          }
          await b.close();
          JS
          node s.mjs
      - name: Save to the screens branch
        working-directory: shots
        run: |
          mkdir out && mv *.png out/ && cd out
          git init -q && git checkout -q -b screens
          git config user.name "screens-bot" && git config user.email "screens-bot@users.noreply.github.com"
          git add . && git commit -qm "App screenshots $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

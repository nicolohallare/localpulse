name: Android app

# Builds the Ube Banana Android app in the cloud.
# Every run produces "ube-banana-test.apk" (install it on any Android phone to test).
# When the Play Store signing secrets are added, it also produces "ube-banana-release.aab" for Google Play.
on:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build web fallback and sync native project
        run: |
          CI=false npm run build
          npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            msg=$(grep -A12 "What went wrong" build.log | head -14 | tr '\n' ' ' | cut -c1-900)
            echo "::error::$msg"
            msg2=$(grep -B2 -A3 -m3 -E "Caused by|e: |error:" build.log | tr '\n' ' ' | cut -c1-900)
            echo "::error::$msg2"
            exit 1
          }

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ube-banana-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test APK as a phone-friendly download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ube-banana-test.apk
          gh release delete android-test --yes --cleanup-tag 2>/dev/null || true
          gh release create android-test ube-banana-test.apk --prerelease --title "Ube Banana — Android test app" \
            --notes "Test build ${{ github.run_number }}. On an Android phone, open this page, tap ube-banana-test.apk, and allow installing from your browser when asked."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build signed Play Store bundle
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          UB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/upload.jks
          ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Publish Play Store bundle as a download
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ube-banana-${{ github.run_number }}.aab
          gh release delete android-play --yes --cleanup-tag 2>/dev/null || true
          gh release create android-play ube-banana-${{ github.run_number }}.aab --prerelease --title "Ube Banana — Google Play upload" \
            --notes "Version code ${{ github.run_number }}. Download the .aab and upload it in Play Console → Test and release."
        env:
          GH_TOKEN: ${{ github.token }}
